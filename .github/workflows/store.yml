name: Store (API + site)

on:
  push:
    paths: ["backend/**", "frontend/**", ".github/workflows/store.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/store.yml"]

permissions:
  contents: read

concurrency:
  group: store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci!Passw0rd2026"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci!Passw0rd2026' -C -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 12

    env:
      SA: "Ci!Passw0rd2026"
      DB_SERVER: localhost
      DB_USER: sa
      DB_PASSWORD: "Ci!Passw0rd2026"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci
      ENVIRONMENT: test
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:8000
      RATE_LIMIT_ENABLED: "false"
      MSSQL_QS: "?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"

    steps:
      - uses: actions/checkout@v4

      - name: Install ODBC Driver 18 and sqlcmd
        run: |
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release; echo $VERSION_ID)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -y -q msodbcsql18 mssql-tools18 unixodbc
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Create databases from the T-SQL scripts
        working-directory: backend
        run: |
          for f in sql/001_schema.sql sql/002_seed.sql sql/003_store_upgrades.sql sql/003_store_upgrades.sql; do
            sqlcmd -S localhost -U sa -P "$SA" -C -b -i "$f"
          done
          sqlcmd -S localhost -U sa -P "$SA" -C -b -Q "CREATE DATABASE PeptidesTest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Backend tests (SQL Server)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          TEST_DATABASE_URL="mssql+pyodbc://sa:Ci%21Passw0rd2026@localhost:1433/PeptidesTest${MSSQL_QS}" \
          SCHEMA_DATABASE_URL="mssql+pyodbc://sa:Ci%21Passw0rd2026@localhost:1433/PeptidesNepal${MSSQL_QS}" \
          python -m pytest -q

      - name: Start API (fake payment gateways)
        working-directory: backend
        run: |
          python -m tests.e2e_seed
          KHALTI_SECRET_KEY=fake_test_key DELIVERY_FEE_INSIDE_VALLEY=100 DELIVERY_FEE_OUTSIDE_VALLEY=250 \
            nohup uvicorn tests.e2e_app:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and start site
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_WHATSAPP_NUMBER: "9779800000000"
        run: |
          npm ci
          npm run typecheck
          npm run build
          nohup npm start > web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000 > /dev/null && break; sleep 1; done

      - name: End-to-end tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Logs and report on failure
        if: failure()
        run: |
          tail -n 100 backend/api.log || true
          tail -n 100 frontend/web.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
